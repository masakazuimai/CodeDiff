        background: #f0f0f0;
        border-radius: 10px;

      .code-container label {
        font-weight: bold;
        margin-bottom: 5px;
        color: #555;
      }

      .button-container {
        display: flex;
        gap: 10px;
        margin: 40px auto;
        width: 80%;
        max-width: 1400px;
      }

      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background: #e0e0e0;
        border: none;
        border-radius: 10px;
        box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.1), -6px -6px 12px rgba(255, 255, 255, 0.7); /* Neumorphism shadow effect */

      button:active {

      footer {

      /* 追加された部分（追加されたテキストに緑色） */

  <body>
    <header>

    </header>
    <div class="container">
      <div class="code-container">
        <label for="code1">sample code:</label>
        <div id="code1" class="code" contenteditable="true" placeholder="コードを貼り付けてください..."></div>
      </div>

      <div class="code-container">
        <label for="code2">my code:</label>
        <div id="code2" class="code" contenteditable="true" placeholder="コードを貼り付けてください..."></div>
      </div>
    </div>

    <div class="button-container">
      <button id="checkDiffBtn">差分をチェック</button>
      <button id="clearBtn">クリア</button>
    </div>

    <div id="result"></div>

    <script src="https://cdn.jsdelivr.net/npm/diff@5.0.0/dist/diff.min.js"></script>
    <script>
      // HTMLエスケープ関数（タグを文字列として表示するため）
      function escapeHTML(str) {
        return str
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\u3000/g, '<span class="full-width-space">□</span>'); // 全角スペースを可視化
      }

      // コード貼り付け時にHTMLエスケープを適用する
      function handlePaste(event) {
        event.preventDefault(); // デフォルトの貼り付け処理を防止
        const clipboardData = event.clipboardData || window.clipboardData;
        const pastedData = clipboardData.getData("text");
        const escapedData = escapeHTML(pastedData);
        document.execCommand("insertHTML", false, escapedData);
      }

      // 差分をチェックするボタンの処理
      document.getElementById("checkDiffBtn").addEventListener("click", function () {
        // 不要な空行を削除してからデータ取得
        const code1 = document.getElementById("code1").innerText.trim().replace(/\n+/g, "\n");

        const code2 = document.getElementById("code2").innerText.trim().replace(/\n+/g, "\n");

        const diff = Diff.diffChars(code1, code2);

        let newCode1 = "";
        let newCode2 = "";

        diff.forEach((part) => {
          const escapedValue = escapeHTML(part.value);

          if (part.added) {
            newCode2 += `<span class="added">` + escapedValue + `</span>`;
          } else if (part.removed) {
            newCode1 += `<span class="removed">` + escapedValue + `</span>`;
          } else {
            newCode1 += `<span>` + escapedValue + `</span>`;
            newCode2 += `<span>` + escapedValue + `</span>`;
          }
        });

        document.getElementById("code1").innerHTML = newCode1;
        document.getElementById("code2").innerHTML = newCode2;
      });

      // クリアボタンの処理
      document.getElementById("clearBtn").addEventListener("click", function () {
        document.getElementById("code1").innerHTML = "";
        document.getElementById("code2").innerHTML = "";
        document.getElementById("result").innerHTML = "";
      });

      // コード入力欄にペースト時のエスケープ処理を追加
      document.getElementById("code1").addEventListener("paste", handlePaste);
      document.getElementById("code2").addEventListener("paste", handlePaste);
    </script>
  </body>
